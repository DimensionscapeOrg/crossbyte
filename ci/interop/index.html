<!doctype html>
<meta charset="utf-8">
<title>CrossByte WebRTC interop</title>
<body>
<pre id="log"></pre>
<script>
// The browser half of the interoperability test, in either direction.
//
// A plain RTCPeerConnection doing nothing unusual: it either offers and takes
// an answer, or takes an offer and answers. Everything unusual is on the other
// side of the wire.
//
// The harness drives this through page.evaluate rather than the page reaching
// out on its own, so one process decides the order of events and there is no
// second signalling channel to get wrong.

const log = [];

function note(line) {
  log.push(line);
  document.getElementById('log').textContent = log.join('\n');
}

window.__interop = {
  log,
  ready: false,
  echoed: null,
  // Binary crosses as PPID 53 and an *empty* binary message as PPID 57 --
  // RFC 8831 gives zero-length messages protocol ids of their own, carried as
  // one zero byte, and that is exactly the subtlety two implementations could
  // fumble in the same way. A real browser is the referee.
  binaryEchoed: null,
  emptyBinaryEchoed: false,
  failed: null
};

let connection = null;

function makeConnection() {
  connection = new RTCPeerConnection({ iceServers: [] });

  connection.onconnectionstatechange = () => {
    note('connection: ' + connection.connectionState);

    if (connection.connectionState === 'failed') {
      window.__interop.failed = 'connection failed';
    }
  };

  connection.oniceconnectionstatechange = () => note('ice: ' + connection.iceConnectionState);

  // The offering direction: CrossByte opens the channel, so this is how the
  // browser learns about it.
  connection.ondatachannel = event => {
    const channel = event.channel;
    note('channel arrived: ' + channel.label);

    channel.onmessage = message => {
      note('message: ' + message.data);
      window.__interop.echoed = message.data;
      channel.send('echo:' + message.data);
    };
  };

  return connection;
}

// Waiting for gathering to finish rather than trickling. The far side takes one
// description and starts checking; trickle would need a second signalling path
// for candidates alone, which is more moving parts than this test needs.
function gathered() {
  return new Promise(resolve => {
    if (connection.iceGatheringState === 'complete') {
      resolve();
      return;
    }

    const done = () => {
      if (connection.iceGatheringState === 'complete') {
        connection.removeEventListener('icegatheringstatechange', done);
        resolve();
      }
    };

    connection.addEventListener('icegatheringstatechange', done);
    // Chrome occasionally settles without firing the final transition; this
    // stops the test hanging on an event that is not coming.
    setTimeout(resolve, 3000);
  });
}

/** The browser offers. A channel created first is what puts m=application in it. */
window.__createOffer = async function () {
  makeConnection();

  const channel = connection.createDataChannel('interop');
  channel.binaryType = 'arraybuffer';

  channel.onopen = () => {
    note('channel open');
    window.__interop.ready = true;
    channel.send('from the browser');
    channel.send(new Uint8Array([1, 2, 3, 0, 250, 255]));
    channel.send(new ArrayBuffer(0));
  };

  channel.onmessage = message => {
    if (message.data instanceof ArrayBuffer) {
      const bytes = Array.from(new Uint8Array(message.data));
      note('binary echo: [' + bytes.join(',') + ']');

      if (bytes.length === 0) {
        window.__interop.emptyBinaryEchoed = true;
      } else {
        window.__interop.binaryEchoed = bytes.join(',');
      }

      return;
    }

    note('message: ' + message.data);
    window.__interop.echoed = message.data;
  };

  await connection.setLocalDescription(await connection.createOffer());
  await gathered();

  note('offer gathered');
  return connection.localDescription.sdp;
};

window.__acceptAnswer = async function (sdp) {
  await connection.setRemoteDescription({ type: 'answer', sdp });
  note('answer accepted');
  return true;
};

/** CrossByte offers; the browser answers and waits to be given a channel. */
window.__answerOffer = async function (sdp) {
  makeConnection();

  await connection.setRemoteDescription({ type: 'offer', sdp });
  await connection.setLocalDescription(await connection.createAnswer());
  await gathered();

  note('answer gathered');
  return connection.localDescription.sdp;
};
</script>
</body>
