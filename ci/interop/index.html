<!doctype html>
<meta charset="utf-8">
<title>CrossByte WebRTC interop</title>
<body>
<pre id="log"></pre>
<script>
// The browser half of the interoperability test, in either direction.
//
// A plain RTCPeerConnection doing nothing unusual: it either offers and takes
// an answer, or takes an offer and answers. Everything unusual is on the other
// side of the wire.
//
// The harness drives this through page.evaluate rather than the page reaching
// out on its own, so one process decides the order of events and there is no
// second signalling channel to get wrong.

const log = [];

function note(line) {
  log.push(line);
  document.getElementById('log').textContent = log.join('\n');
}

window.__interop = {
  log,
  ready: false,
  echoed: null,
  // Binary crosses as PPID 53 and an *empty* binary message as PPID 57 --
  // RFC 8831 gives zero-length messages protocol ids of their own, carried as
  // one zero byte, and that is exactly the subtlety two implementations could
  // fumble in the same way. A real browser is the referee.
  binaryEchoed: null,
  emptyBinaryEchoed: false,
  // Partial reliability. Messages CrossByte sent on an ordered channel with
  // maxRetransmits 0, the first of which it deliberately loses: they arrive
  // only if the browser acts on the FORWARD TSN CrossByte sends to skip it.
  orderedState: [],
  // The terms of a channel CrossByte opened, as the browser read them.
  stateTerms: null,
  // Labels of the channels whose close has completed here. A close completes
  // only once both ends have reset their streams (RFC 8831 section 6.7), so
  // one closed from either side shows up here only if CrossByte did its half.
  closed: {},
  failed: null
};

let connection = null;

// Every channel there has been, by label, so one can be closed by name.
const channels = {};

function track(channel) {
  channels[channel.label] = channel;
  channel.addEventListener('close', () => {
    window.__interop.closed[channel.label] = true;
    note('closed: ' + channel.label);
  });
}

window.__closeChannel = function (label) {
  channels[label].close();
  return true;
};

// The channel the browser opened, kept for the message sent after an ICE
// restart: it has to cross the session the restart left in place.
let interopChannel = null;

function makeConnection() {
  connection = new RTCPeerConnection({ iceServers: [] });

  connection.onconnectionstatechange = () => {
    note('connection: ' + connection.connectionState);

    if (connection.connectionState === 'failed') {
      window.__interop.failed = 'connection failed';
    }
  };

  connection.oniceconnectionstatechange = () => note('ice: ' + connection.iceConnectionState);

  // The offering direction: CrossByte opens the channel, so this is how the
  // browser learns about it.
  connection.ondatachannel = event => {
    const channel = event.channel;
    note('channel arrived: ' + channel.label);
    track(channel);

    // CrossByte's partially reliable channel: what matters is how its terms
    // read here, which is the DCEP channel type and parameter it wrote.
    if (channel.label === 'state') {
      window.__interop.stateTerms = { ordered: channel.ordered, maxRetransmits: channel.maxRetransmits };
      note('state terms: ' + JSON.stringify(window.__interop.stateTerms));
      return;
    }

    channel.onmessage = message => {
      note('message: ' + message.data);
      window.__interop.echoed = message.data;
      channel.send('echo:' + message.data);
    };
  };

  return connection;
}

// Waiting for gathering to finish rather than trickling. The far side takes one
// description and starts checking; trickle would need a second signalling path
// for candidates alone, which is more moving parts than this test needs.
function gathered() {
  return new Promise(resolve => {
    if (connection.iceGatheringState === 'complete') {
      resolve();
      return;
    }

    const done = () => {
      if (connection.iceGatheringState === 'complete') {
        connection.removeEventListener('icegatheringstatechange', done);
        resolve();
      }
    };

    connection.addEventListener('icegatheringstatechange', done);
    // Chrome occasionally settles without firing the final transition; this
    // stops the test hanging on an event that is not coming.
    setTimeout(resolve, 3000);
  });
}

/** The browser offers. A channel created first is what puts m=application in it. */
window.__createOffer = async function () {
  makeConnection();

  const channel = connection.createDataChannel('interop');
  channel.binaryType = 'arraybuffer';
  interopChannel = channel;
  track(channel);

  // Two partially reliable channels, which is what a game's state traffic
  // uses: CrossByte reports the terms it read from each, and loses its own
  // first message on the ordered one to see the browser skip past it.
  track(connection.createDataChannel('state', { ordered: false, maxRetransmits: 0 }));

  const orderedState = connection.createDataChannel('ordered-state', { ordered: true, maxRetransmits: 0 });
  track(orderedState);
  let answered = false;
  orderedState.onmessage = message => {
    note('ordered-state: ' + message.data);
    window.__interop.orderedState.push(message.data);

    // And the same the other way: CrossByte loses the first of these as it
    // arrives, so this browser has to give up on it and send a FORWARD TSN of
    // its own. Only once CrossByte has spoken, by which time it is ready to.
    if (!answered) {
      answered = true;
      orderedState.send('b-lost');

      for (let i = 1; i <= 5; i++) {
        orderedState.send('b-kept-' + i);
      }
    }
  };

  channel.onopen = () => {
    note('channel open');
    window.__interop.ready = true;
    channel.send('from the browser');
    channel.send(new Uint8Array([1, 2, 3, 0, 250, 255]));
    channel.send(new ArrayBuffer(0));
  };

  channel.onmessage = message => {
    if (message.data instanceof ArrayBuffer) {
      const bytes = Array.from(new Uint8Array(message.data));
      note('binary echo: [' + bytes.join(',') + ']');

      if (bytes.length === 0) {
        window.__interop.emptyBinaryEchoed = true;
      } else {
        window.__interop.binaryEchoed = bytes.join(',');
      }

      return;
    }

    note('message: ' + message.data);
    window.__interop.echoed = message.data;
  };

  await connection.setLocalDescription(await connection.createOffer());
  await gathered();

  note('offer gathered');
  return connection.localDescription.sdp;
};

window.__acceptAnswer = async function (sdp) {
  await connection.setRemoteDescription({ type: 'answer', sdp });
  note('answer accepted');
  return true;
};

// ICE restarts, which is what a browser does when its network changes: new
// credentials in a new offer, the DTLS session and every channel left as they
// are. Gathering starts again, so this waits for it rather than trusting a
// state left over from the first round.
function regathered() {
  return new Promise(resolve => {
    const done = () => {
      if (connection.iceGatheringState === 'complete') {
        connection.removeEventListener('icegatheringstatechange', done);
        resolve();
      }
    };

    connection.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, 3000);
  });
}

/** The browser restarts ICE and offers. */
window.__restartIce = async function () {
  connection.restartIce();
  const offer = await connection.createOffer();
  const gathering = regathered();
  await connection.setLocalDescription(offer);
  await gathering;
  note('restart offer gathered');
  return connection.localDescription.sdp;
};

window.__acceptRestartAnswer = async function (sdp) {
  await connection.setRemoteDescription({ type: 'answer', sdp });
  note('restart answer accepted');
  return true;
};

/** CrossByte restarted ICE and offered; the browser answers. */
window.__answerRestart = async function (sdp) {
  await connection.setRemoteDescription({ type: 'offer', sdp });
  const answer = await connection.createAnswer();
  const gathering = regathered();
  await connection.setLocalDescription(answer);
  await gathering;
  note('restart answer gathered');
  return connection.localDescription.sdp;
};

/** The ufrag of the local candidate on the pair the browser is using, which a finished restart changes. */
window.__selectedUfrag = async function () {
  const stats = await connection.getStats();
  let transport = null;
  stats.forEach(report => {
    if (report.type === 'transport' && report.selectedCandidatePairId) transport = report;
  });

  if (!transport) return null;

  const pair = stats.get(transport.selectedCandidatePairId);
  const local = pair ? stats.get(pair.localCandidateId) : null;

  if (!local) return null;

  // A Chrome whose stats do not name it says so, rather than never matching.
  return 'usernameFragment' in local ? local.usernameFragment : 'n/a';
};

window.__sendOnInterop = function (text) {
  interopChannel.send(text);
  return true;
};

/** CrossByte offers; the browser answers and waits to be given a channel. */
window.__answerOffer = async function (sdp) {
  makeConnection();

  await connection.setRemoteDescription({ type: 'offer', sdp });
  await connection.setLocalDescription(await connection.createAnswer());
  await gathered();

  note('answer gathered');
  return connection.localDescription.sdp;
};
</script>
</body>
