name: CrossByte hl and neko
run-name: CrossByte hl and neko | ${{ github.event_name }} | ${{ github.ref_name }}

# hl and neko are listed as targets, and neither was built here: from
# 2026-04-28 neither compiled at all: CrossByte's own sys.net.Socket had no
# branch for them, and each target's sys.ssl.Socket extends it: and nothing
# said so for five months. These jobs build the whole suite for both and run
# it wherever a runtime can be had: neko arrives with Haxe; HashLink comes
# from its release zip on Windows and is built from the same tag on Linux,
# since its releases carry no Linux binary.
#
# utest comes through .github/actions/haxelibs, from a cache or GitHub, so
# these jobs do not depend on lib.haxe.org. ci.yml's header says how a
# failure reads.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl-neko-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: "4.3.7"
  # 1.13 is the floor: haxe.atomic does not compile for hl below it, and
  # ci/hl-tests.hxml passes -D hl-ver=1.13.0 to match. The suite was brought
  # up on 1.14, whose collector now and then marked a block that was never
  # allocated and died in gc_flush_mark on Linux: two runs on main in seven.
  # 1.15 has HashLink's fix for that (#756); thirty runs of the suite on it,
  # and thirty on 1.14 with #756 alone, never crashed. Move the two together.
  HASHLINK_TAG: "1.15"
  HASHLINK_VERSION: "1.15.0"

jobs:
  neko:
    name: Core | neko (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux keeps the reuse a release build has; Windows checks every
          # arrival, as ci.yml's core-tests-checked says why.
          - os: ubuntu-latest
            label: Linux
            defines: ""
          - os: windows-latest
            label: Windows
            defines: "-D crossbyte_check_events"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Neko comes with Haxe, haxelib runs on it, so there is nothing
      # else to install for this target.
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Build neko suite
        run: haxe ci/neko-tests.hxml ${{ matrix.defines }}

      - name: Run neko suite
        if: runner.os != 'Windows'
        run: neko export/neko/CrossByteTests.n

      # Not from Git Bash on Windows, which keeps eight bits of a Windows exit
      # code and maps the rest: an access violation reads 139, a fail-fast
      # abort or a stack overflow 127, and an exit code of 256 reads 0. pwsh
      # sees the code whole, and a pwsh step reports any failure as 1, so the
      # step prints it.
      - name: Run neko suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          neko export/neko/CrossByteTests.n
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::neko export/neko/CrossByteTests.n exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

  hl-windows:
    name: Core | HashLink (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        # As in ci.yml's Native Smoke: a pwsh step does not stop at a native
        # command that fails, so each step runs at most one, as its last
        # command, and the suite's exit code is checked and printed in full.
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      # Compiling needs no HashLink, so this says whether the suite builds
      # for hl even when the runtime below cannot be had.
      - name: Build hl suite
        run: haxe ci/hl-tests.hxml

      # A missing .hdll does not fail at the first call. HashLink resolves
      # every native at load and, on Windows, reports one it cannot find in a
      # dialog box, which on a runner nobody can dismiss, so the job would
      # sit there until it timed out. So the libraries the suite loads are
      # checked for here, and a missing one fails the step by name. The trap
      # puts what failed, a throw below, or a cmdlet's error, on the run
      # page as well as in the log.
      - name: Install HashLink ${{ env.HASHLINK_VERSION }}
        run: |
          trap { Write-Host "::error::$_"; break }
          $zip = Join-Path $env:RUNNER_TEMP "hashlink.zip"
          $dest = Join-Path $env:RUNNER_TEMP "hashlink"
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/hashlink/releases/download/$env:HASHLINK_TAG/hashlink-$env:HASHLINK_VERSION-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $hl = Get-ChildItem -Path $dest -Recurse -Filter hl.exe | Select-Object -First 1
          if ($null -eq $hl) {
            throw "hashlink-$env:HASHLINK_VERSION-win.zip has no hl.exe"
          }
          foreach ($lib in @("ssl", "fmt", "sqlite", "mysql")) {
            if (-not (Test-Path (Join-Path $hl.DirectoryName "$lib.hdll"))) {
              throw "HashLink $env:HASHLINK_VERSION has no $lib.hdll, which the suite loads"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $hl.DirectoryName
          & $hl.FullName --version

      - name: Run hl suite
        run: |
          hl export/hl/CrossByteTests.hl
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::hl export/hl/CrossByteTests.hl exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

  hl-linux:
    name: Core | HashLink (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Build hl suite
        run: haxe ci/hl-tests.hxml

      # Only the libraries the suite loads, ssl, fmt, sqlite and mysql, all
      # four resolved at load, and what they link against: mbedTLS for ssl,
      # zlib and the image and audio codecs fmt also carries, SQLite. uv is
      # built too, and SDL, OpenAL and ui are left out.
      - name: Build HashLink ${{ env.HASHLINK_TAG }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmbedtls-dev libpng-dev libturbojpeg0-dev libvorbis-dev \
            zlib1g-dev libuv1-dev libsqlite3-dev
          git clone --depth 1 --branch "$HASHLINK_TAG" https://github.com/HaxeFoundation/hashlink.git "$RUNNER_TEMP/hashlink"
          make -C "$RUNNER_TEMP/hashlink" -j"$(nproc)" libhl hl fmt ssl uv mysql sqlite
          sudo make -C "$RUNNER_TEMP/hashlink" install
          sudo ldconfig
          hl --version

      - name: Run hl suite
        run: hl export/hl/CrossByteTests.hl
