name: CrossByte CI
run-name: CrossByte CI | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# How these jobs install, and how a failure reads:
# - The Haxe libraries come through .github/actions/haxelibs: from a cache,
#   else from GitHub at the commits ci/haxelibs.txt pins, else from
#   lib.haxe.org, so CI does not depend on the registry. hxcpp comes from the
#   fork on GitHub through .github/actions/hxcpp.
# - A bash step runs as `bash -e -o pipefail` (GitHub's flags for
#   `shell: bash`): the first command that fails ends the step, and the
#   runner reports that command's exit code as it is. A step of several
#   commands also traps the failure, to name the command.
# - A pwsh step does not stop at a failing native command. Native Smoke
#   says how the Windows jobs' steps are written instead.

env:
  HAXE_VERSION: "4.3.7"
  HXCPP_REPO: "https://github.com/dimensionscape/hxcpp.git"
  # The branch this project is developed against, not the one the upstream PR
  # lives on. socket-fixes is kept clean and narrow so HaxeFoundation can take
  # it; production is that fix plus the Windows file_write correction and a
  # catch-up with upstream, and is what a local build uses, so CI and every
  # developer test the same hxcpp.
  HXCPP_REF: "production"

jobs:
  core-tests:
    name: Core | Haxe Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      # haxe itself, not `haxelib run aedifex task interp-tests`: haxelib's
      # aedifex is 0.0.2, which has no `task` command, prints its banner and
      # exits 0, so a step written that way is green without running anything.
      # Each task in Aedifex.hx is one hxml, so this is the same command without
      # the tool in between.
      - name: Run interpreter test suite
        run: haxe ci/interp-tests.hxml

      # `-D final` (Lime's -final defines it) inlines the loop's and the socket
      # registry's hot functions, and no test build defines it, so a return
      # added mid-function could stop every final build compiling with nothing
      # noticing. Type-checked here and in the native suite job.
      - name: Type-check a final build
        run: haxe ci/interp-tests.hxml -D final --no-output

      # Every sample's check.hxml begins with --cwd ../.., so it runs from
      # its own directory, which is what --cwd reproduces here. A sample
      # that fails is named after its log group closes, so the error is not
      # folded away inside it.
      - name: Validate sample builds
        run: |
          set -euo pipefail
          for sample in \
            arena \
            http2 \
            localconnection \
            multicore \
            rpc-greeter \
            rudp \
            sharedchannel \
            sharedobject \
            simple-application \
            socket-chat \
            udp \
            web-server \
            websocket-echo \
            windows-service \
            worker; do
            echo "::group::samples/${sample}"
            rc=0
            haxe --cwd "samples/${sample}" check.hxml || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::samples/${sample}/check.hxml did not type-check (exit code $rc)"
              exit "$rc"
            fi
          done

  # An event, and the bytes it carries, is valid only during the listener
  # call it is handed to: CrossByte fills the same objects for the next
  # arrival. Code that keeps one past its call reads the next arrival's bytes
  # (wrong bytes, not a crash), so every target family runs its suite once
  # more with -D crossbyte_check_events somewhere, which kills each payload
  # once its call returns, and a keeper reads 0xDB or nothing instead. A job
  # of its own so the interpreter's second pass adds nothing to the wall time;
  # the other families take theirs in their own jobs below.
  core-tests-checked:
    name: Core | Haxe Tests (arrivals checked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Run interpreter test suite with arrivals checked
        run: haxe ci/interp-tests.hxml -D crossbyte_check_events

  # The jvm target, smoke and full suites, on Java 8 deliberately: it is the
  # floor the jvm's bytecode quirks (VerifyErrors from some code shapes) are
  # checked against, and a newer JVM would not reproduce them. The full suite
  # also catches what the jvm renders differently, such as IPv6 text.
  jvm-tests:
    name: Core | JVM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # utest, and hxjava, which --jvm needs.
      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Build jvm smoke suite
        run: haxe ci/jvm-smoke.hxml

      - name: Build jvm test suite
        run: haxe ci/jvm-tests.hxml

      # The smoke jar covers the non-networking core; the full jar adds
      # auth, db, http, net, ipc and system. Both run, because the smoke
      # subset passing says nothing about the rest.
      - name: Run jvm smoke suite
        run: java -jar export/jvm/CrossByteJvmSmoke.jar

      - name: Run jvm test suite
        run: java -jar export/jvm/CrossByteTests.jar

      # Again with every arrival's payload killed once its call returns (see
      # core-tests-checked). The same jar path: the hxml names its output.
      - name: Build jvm test suite with arrivals checked
        run: haxe ci/jvm-tests.hxml -D crossbyte_check_events

      - name: Run jvm test suite with arrivals checked
        run: java -jar export/jvm/CrossByteTests.jar

  docs:
    name: Core | API Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # dox, and the rest of the list.
      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      # From the fork on GitHub, as everywhere. Nothing here compiles C++, so
      # its tools are not built.
      - name: Install hxcpp
        run: haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}

      # Before the XML is built, because these examples are what goes into it.
      # A reader who copies one out of the published docs expects it to
      # compile, and an example inherited from ActionScript can hide a method
      # that does not exist, an instance method called statically, or an
      # unescaped Windows path. Nothing but a compiler is going to notice. The
      # guides in docs/ are checked here too: their examples are whole
      # programs, read in order.
      - name: Typecheck documentation examples
        run: node ci/doc-examples.js

      - name: Build API XML
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          rm -rf export/docs-api export/docs-site
          mkdir -p export/docs-api export/docs-site
          haxe ci/docs-api.hxml

      - name: Generate docs site
        run: |
          haxelib run dox \
            -i export/docs-api/crossbyte.xml \
            -o export/docs-site \
            --title CrossByte \
            --toplevel-package crossbyte \
            --include '^crossbyte(\.|$)' \
            --exclude '\._internal(\.|$)' \
            -D version "1.0.0-rc.1" \
            -D source-path "https://github.com/dimensionscapeorg/crossbyte/blob/main/src/" \
            -D website "https://github.com/dimensionscapeorg/crossbyte" \
            -D logo crossbyte.png \
            -D description "CrossByte API reference"

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbyte-api-docs
          path: export/docs-site
          if-no-files-found: error

  cpp-audit:
    name: Core | hxcpp API Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # haxe directly, for the reason on the interpreter step above: through
      # haxelib's aedifex 0.0.2 each of these would print a banner and pass
      # without running.
      - name: Type-check C++ API surface
        run: haxe ci/cpp-api-audit.hxml

      - name: Type-check timer burst support
        run: haxe ci/cpp-timer-burst-audit.hxml

      # precision_tick swaps the frame wait for one that spins the tail
      # rather than sleeping it. No test hxml defines it, so without this the
      # branch would compile nowhere and could be broken by any edit to the
      # loop without a single job noticing.
      - name: Type-check precision tick frame wait
        run: haxe ci/cpp-precision-tick-audit.hxml

  posix-crypto:
    name: Core | Crypto, System (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Two native builds from cold: on the Intel macOS runner they take ten to
    # thirteen minutes each, which is close to 25 minutes before anything has
    # run.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          # Intel, not macos-latest, which is Apple Silicon. Haxe 4.3.7 publishes
          # no macOS arm64 build (the release carries haxe-4.3.7-osx.tar.gz, x64,
          # and haxe-4.3.7-linux-arm64.tar.gz, and nothing else), so setup-haxe
          # refuses an arm64 runner with "arm64 not supported" and the job dies
          # before it installs anything. This is a standard Intel runner rather
          # than one of the paid -large ones.
          - os: macos-15-intel
            label: macOS
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        # v2, here and not yet elsewhere: v1 installs Neko where the macOS
        # haxelib binary cannot find it ("dyld: Library not loaded:
        # @rpath/libneko.2.dylib"), which setup-haxe fixed in v2.0.0 (#47). The
        # other jobs pass on v1 and are left alone.
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # libsodium is compiled from vendored sources, so there is nothing
      # to install; this job proves that build works off Windows. Two native
      # builds from cold on the Intel macOS runner come close to the job's
      # bound, so the compiler cache the native suite's job keeps makes the
      # second run of each warm.
      #
      # Each value is taken into a variable before it is written: a command
      # that fails inside "$(...)" in an echo's argument fails nothing, and
      # the cache key would be written without the commit.
      - name: Point hxcpp at a compiler cache
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          HXCPP_DIR="$(haxelib libpath hxcpp)"
          # Keyed on the fork's commit, not its branch: a cache from another
          # hxcpp holds a precompiled hxcpp.h that clang refuses ("modified
          # since the precompiled header was built").
          HXCPP_SHA="$(git -C "$HXCPP_DIR" rev-parse --short HEAD)"
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-cache" >> "$GITHUB_ENV"
          echo "HXCPP_SHA=$HXCPP_SHA" >> "$GITHUB_ENV"
          # The commit is not enough: a fresh clone stamps every file with
          # the time of the clone, and clang checks those times too, so a
          # cache from an earlier run on the same commit would be refused the
          # same way. Stamp the headers with the commit's own time, which every
          # clone of it shares.
          STAMP="$(TZ=UTC git -C "$HXCPP_DIR" log -1 --format=%cd --date=format-local:%Y%m%d%H%M.%S)"
          find "$HXCPP_DIR/include" -type f -exec env TZ=UTC touch -t "$STAMP" {} +

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-posix-cryptosys-stamped-${{ matrix.os }}-${{ env.HXCPP_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-posix-cryptosys-stamped-${{ matrix.os }}-${{ env.HXCPP_SHA }}-

      - name: Build crypto suite
        run: haxe ci/posix-crypto-tests.hxml

      - name: Run crypto suite
        run: ./export/ci-posix-crypto/PosixCryptoMain

      # System reaches a different implementation per platform, and the group
      # that covers it runs from the native smoke suite, a Windows job. Both
      # POSIX implementations are built and run here for the same reason
      # libsodium is above.
      - name: Build system suite
        run: haxe ci/posix-system-tests.hxml

      - name: Run system suite
        run: ./export/ci-posix-system/PosixSystemMain

  posix-native:
    name: Core | Native Suite (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # The whole native suite, which Native Smoke runs on Windows only. Every
    # networking class in it (sockets, TLS, HTTP/1.1 and HTTP/2, WebSocket,
    # reliable UDP) runs here on the systems servers mostly use, where it
    # can behave differently: a refused connect announced as CONNECT and
    # then CLOSE on Linux, say, where Windows says ioError. A cold build is
    # about five minutes on four Linux cores; the Intel macOS runner is
    # slower, as the crypto job above shows.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, where servers run, and Windows' Native Smoke keep the
          # reuse a release build has; macOS checks every arrival instead
          # (see core-tests-checked), which costs it no extra run.
          - os: ubuntu-latest
            label: Linux
            defines: ""
          - os: macos-15-intel
            label: macOS
            defines: "-D crossbyte_check_events"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # As Native Smoke keeps one: a run compiles what changed. Each value is
      # taken into a variable before it is written, as in the crypto job.
      - name: Point hxcpp at a compiler cache
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          HXCPP_DIR="$(haxelib libpath hxcpp)"
          # Keyed on the fork's commit, not its branch: a cache from another
          # hxcpp holds a precompiled hxcpp.h that clang refuses ("modified
          # since the precompiled header was built").
          HXCPP_SHA="$(git -C "$HXCPP_DIR" rev-parse --short HEAD)"
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-cache" >> "$GITHUB_ENV"
          echo "HXCPP_SHA=$HXCPP_SHA" >> "$GITHUB_ENV"
          # The commit is not enough: a fresh clone stamps every file with
          # the time of the clone, and clang checks those times too, so a
          # cache from an earlier run on the same commit would be refused the
          # same way. Stamp the headers with the commit's own time, which every
          # clone of it shares.
          STAMP="$(TZ=UTC git -C "$HXCPP_DIR" log -1 --format=%cd --date=format-local:%Y%m%d%H%M.%S)"
          find "$HXCPP_DIR/include" -type f -exec env TZ=UTC touch -t "$STAMP" {} +

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-posix-native-stamped-${{ matrix.os }}-${{ env.HXCPP_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-posix-native-stamped-${{ matrix.os }}-${{ env.HXCPP_SHA }}-

      - name: Type-check a final build
        run: haxe ci/posix-native-tests.hxml -D final --no-output

      - name: Build native suite
        # Traced: each case names itself as it starts, so a run that hangs
        # says where, rather than printing nothing after its last server's log
        # line. Not stripped, so a stack taken below names its functions:
        # stripped, every frame reads ___lldb_unnamed_symbol.
        run: haxe ci/posix-native-tests.hxml -D test_trace -D nostrip ${{ matrix.defines }}

      # The relay tests bind 127.0.0.2 and 127.0.0.3, so that what a peer
      # sends itself and what the relay forwards do not share a source. Linux
      # answers on all of 127/8; macOS has only 127.0.0.1 until told.
      - name: Add the loopback addresses the relay tests bind
        if: runner.os == 'macOS'
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up

      # macOS's openssl is LibreSSL, which does not make the client
      # certificate chain two TLS cases need: they would warn that they did
      # not run, and a warning fails the run. Homebrew's OpenSSL 3 makes it.
      - name: Put OpenSSL 3 before macOS's LibreSSL
        if: runner.os == 'macOS'
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          prefix="$(brew --prefix openssl@3 2>/dev/null || true)"
          if [ ! -x "$prefix/bin/openssl" ]; then
            brew install openssl@3
            prefix="$(brew --prefix openssl@3)"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/openssl" version

      - name: Run native suite
        working-directory: export/ci-posix-native
        # A whole run takes about five minutes on Linux, longer on the Intel
        # macOS runner. Past forty it has hung, and the last [TEST] line
        # names the case. A crash says only "Segmentation fault", so a run
        # that ends on a signal is run again under a debugger: a crash that
        # repeats leaves every thread's stack in the log. The step fails
        # with the first run's status either way.
        timeout-minutes: 40
        run: |
          rc=0
          ./NativeSmokeMain || rc=$?
          if [ "$rc" -ge 128 ]; then
            echo "The suite ended on signal $((rc - 128)); running it again under a debugger."
            if command -v lldb > /dev/null; then
              sudo DevToolsSecurity -enable > /dev/null 2>&1 || true
              # The signals the suite raises on purpose (SIGHUP, SIGINT,
              # SIGTERM) and SIGPIPE pass straight to it: lldb stops on any
              # signal otherwise, the hangup test's SIGHUP among them.
              lldb --batch \
                -o "process launch --stop-at-entry" \
                -o "process handle SIGHUP SIGINT SIGTERM SIGPIPE SIGUSR1 SIGUSR2 SIGCHLD -s false -p true -n false" \
                -o "continue" \
                -k "thread backtrace all" -k "quit 1" -- ./NativeSmokeMain || true
            elif command -v gdb > /dev/null; then
              gdb -batch -ex "handle SIGHUP SIGINT SIGTERM SIGPIPE SIGUSR1 SIGUSR2 nostop noprint pass" \
                -ex run -ex "thread apply all bt" ./NativeSmokeMain || true
            fi
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::NativeSmokeMain exited with code $rc"
          fi
          exit $rc

  postgres:
    name: Data | Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # The driver dlopens libpq at runtime rather than linking it, so the
      # client library has to be installed even though nothing links against it.
      # libpq.so.5 is the name it looks for.
      - name: Install libpq
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          sudo apt-get update
          sudo apt-get install -y libpq5

      - name: Build postgres integration suite
        run: haxe ci/postgres-tests.hxml

      # CROSSBYTE_PG_REQUIRED is what makes this job mean anything: without a
      # reachable server the suite would otherwise skip every case and report a
      # green run, so a broken service container or a missing libpq would look
      # exactly like success. With it set, not reaching the server fails.
      - name: Run postgres integration suite
        env:
          CROSSBYTE_PG_REQUIRED: "1"
          CROSSBYTE_PG_HOST: 127.0.0.1
          CROSSBYTE_PG_PORT: "5432"
          CROSSBYTE_PG_USER: postgres
          CROSSBYTE_PG_PASSWORD: postgres
          CROSSBYTE_PG_DATABASE: postgres
        run: ./export/ci-postgres-tests/PostgresIntegrationMain

  native-smoke:
    name: Core | Native Smoke
    runs-on: windows-latest
    # A run takes about 21 minutes, the samples aside, and the browser and
    # TURN interop steps move with the network. 35 leaves room for a slow
    # runner without letting a hang run on.
    timeout-minutes: 35
    defaults:
      run:
        # A pwsh step does not stop at a native command that fails: it runs
        # on, and the step reports only the last one's exit code, so a failed
        # `haxelib install` could pass its step and fail a later one. So each
        # step here runs one native command, and the installs run in bash, in
        # .github/actions. A step that runs a test or a sample checks the exit
        # code itself and prints it in full, because the step reports any
        # non-zero code as 1: an access violation reads 0xC0000005 only in that
        # line.
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # utest, and hxnodejs for the Node builds.
      - name: Install Haxe libraries
        uses: ./.github/actions/haxelibs

      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # One compiler cache for the three native builds below (the benchmark,
      # the suite and the stress suite share the runtime and most of
      # CrossByte), kept from run to run, so a run compiles what changed.
      # hxcpp keys an object by its source and flags, so what an older commit
      # left is simply not used. The key is new every run, so each run saves
      # what it compiled; the restore takes the newest.
      - name: Point hxcpp at a compiler cache
        run: echo "HXCPP_COMPILE_CACHE=$env:RUNNER_TEMP\hxcpp-cache" >> $env:GITHUB_ENV

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\hxcpp-cache
          key: hxcpp-native-smoke-${{ env.HXCPP_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-native-smoke-${{ env.HXCPP_REF }}-

      - name: Build browser (js) target
        run: haxe ci/js-build.hxml

      - name: Build Node target
        run: haxe ci/node-build.hxml

      - name: Build portable suite for Node
        run: haxe ci/js-tests.hxml

      - name: Run portable suite on Node
        run: |
          node export/js-tests/tests.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node export/js-tests/tests.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # Again with every arrival's payload killed once its call returns (see
      # core-tests-checked), over the same output.
      - name: Build portable suite for Node with arrivals checked
        run: haxe ci/js-tests.hxml -D crossbyte_check_events

      - name: Run portable suite on Node with arrivals checked
        run: |
          node export/js-tests/tests.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node export/js-tests/tests.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build Node-only suite
        run: haxe ci/js-runtime-tests.hxml

      - name: Run Node-only suite on Node
        run: |
          node export/js-runtime-tests/runtime.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node export/js-runtime-tests/runtime.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # puppeteer for the browser steps below, and node-turn for the TURN
      # interop at the end, in one install: `--no-save` prunes whatever is not
      # in package.json, so installing one of them separately uninstalls the
      # other, and the only reason that would not break the browser test is
      # the order these steps run in.
      #
      # Both pinned: unpinned, each run would take whatever npm published
      # last, so a new puppeteer (and the Chrome it downloads) could turn the
      # browser and interop steps red with no change here. These are the
      # versions the interop and browser suites are run against locally;
      # raise them on purpose, in a commit of their own.
      - name: Install puppeteer and node-turn
        run: npm install --no-save --no-audit --no-fund puppeteer@25.9.0 node-turn@0.0.6

      - name: Build portable suite for the browser
        run: haxe ci/browser-tests.hxml

      # Node is not a browser. It has no window, no document, and none of a
      # page's restrictions, so a bundle it runs happily can still fail to load
      # in one: a static initialiser needing something a page is not given (a
      # SharedArrayBuffer behind an AtomicInt, say) throws while loading before
      # any test runs, with every js build green.
      - name: Run portable suite in a headless browser
        run: |
          node ci/browser/run.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node ci/browser/run.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build the browser interop peer
        run: haxe ci/browser-interop.hxml

      # The only job here whose result depends on an implementation nobody in
      # this repository wrote. Every other test proves this code agrees with
      # itself, which is worth a great deal and is not the same thing: a
      # checksum byte order, a chunk layout or an integrity scheme can be
      # perfectly self-consistent and understood by nothing else alive.
      #
      # It runs after the native smoke build because it needs the same
      # toolchain. It catches what no other test can, such as one failed send
      # deafening a UDP socket, which no other test would see without sending
      # somewhere unreachable.
      #
      # Four cases, so it is not quick: both signalling directions, against a
      # browser publishing its addresses and one hiding them behind .local mDNS
      # names. The hiding one is the browser every visitor actually runs, and
      # the only configuration where the path has to be learned from an
      # incoming check rather than dialled.
      - name: Interoperate with a real browser
        run: |
          node ci/interop/run.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node ci/interop/run.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build the support flag probe for Python
        run: haxe ci/python-support.hxml

      # The one target CI can execute that has UDP but no CSPRNG, which is the
      # combination where a support flag can lie: StunClient.isSupported must
      # not say true there while the first line of discover() throws. Every
      # suite above runs where a CSPRNG exists, so only this step can catch it.
      - name: Check support flags on a CSPRNG-less target
        run: |
          python export/python-support/flagprobe.py
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::python export/python-support/flagprobe.py exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build the TURN interop peer
        run: haxe ci/relay-interop.hxml

      # The other test whose result depends on somebody else's code, and for
      # the same reason. The suite connects two peers through a relay written
      # here, which verifies a request with the very code that produced it,
      # so the two agree about anything they are both wrong about. Long-term
      # credentials are the obvious place for that, the key being MD5 of
      # username, realm and password rather than the password itself, but it
      # applies equally to permissions and to how relayed data is wrapped.
      #
      # node-turn implements RFC 5389 and 5766. What it accepts is evidence.
      - name: Interoperate with a real TURN server
        run: |
          node ci/relay/run.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node ci/relay/run.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # Encrypted reliable UDP sessions between targets that seal with three
      # different implementations: native (libsodium), the jvm (CrossByte's
      # own ChaCha20-Poly1305, since Java 8 has none) and Node (its crypto).
      # The suites check each target's sealed bytes against vectors; this
      # checks whole sessions across processes (the handshake, the key
      # schedule, every delivery mode and a close), each pair both ways,
      # and that different keys are refused. Locally: three builds of about
      # 40 s together, and 3 s to run.
      - name: Build the reliable UDP interop native end
        run: haxe ci/rudp-interop.hxml

      - name: Build the reliable UDP interop jvm end
        run: haxe ci/rudp-interop-jvm.hxml

      - name: Build the reliable UDP interop Node end
        run: haxe ci/rudp-interop-node.hxml

      - name: Interoperate encrypted reliable UDP across native, jvm and Node
        run: |
          node ci/rudp-interop/run.js
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::node ci/rudp-interop/run.js exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build the performance suite
        run: haxe ci/bench.hxml

      # Informational: the numbers from a shared runner measure the runner's
      # mood and gate nothing. The step exists so the suite cannot rot: a
      # benchmark that stopped compiling is one nobody has run in a while.
      - name: Run the performance suite (informational)
        run: |
          ./export/bench/BenchMain.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::BenchMain.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build native smoke harness
        run: haxe ci/native-tests.hxml

      - name: Run native smoke suite
        working-directory: export/ci-native-tests
        run: |
          .\NativeSmokeMain.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::NativeSmokeMain.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Build concurrency stress suite
        run: haxe ci/stress-tests.hxml

      # Data races are invisible to the interpreter suites, which are
      # single-threaded. These cases assert invariants under real thread
      # contention and exit non-zero when one is violated.
      - name: Run concurrency stress suite
        working-directory: export/ci-stress-tests
        run: |
          .\StressMain.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::StressMain.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

  # The samples, in a job of their own that builds alongside Native
  # Smoke: fifteen cold native builds would not fit in that job. Each
  # build and run is checked, since a pwsh step reports only its last
  # native command.
  native-samples:
    name: Core | Native Samples
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        # As in Native Smoke: one native command per step, or each one's exit
        # code checked, and a sample's printed in full.
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # Nothing from lib.haxe.org: the samples reach the same native externs
      # as the suites, and need only hxcpp and this checkout registered.
      - name: Install hxcpp
        uses: ./.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}

      # The cache the build below fills, kept from run to run as Native
      # Smoke's is.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\hxcpp-cache
          key: hxcpp-native-samples-${{ env.HXCPP_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-native-samples-${{ env.HXCPP_REF }}-

      # haxe itself rather than `haxelib run aedifex task`: each sample task in
      # Aedifex.hx runs one hxml from the sample's own directory, which --cwd
      # reproduces (every one of them begins with --cwd ../..).
      #
      # One compiler cache for all fifteen. hxcpp keys a cached object by its
      # source and flags, and the samples share the runtime and much of
      # CrossByte, so only the first build pays in full: locally 38s cold,
      # then 5 to 12s each.
      #
      # A native command's exit code does not stop a pwsh script, and the
      # step reports only the last one's, so builds that built nothing could
      # come out green. Each is checked.
      - name: Build native samples
        run: |
          $env:HXCPP_COMPILE_CACHE = Join-Path $env:RUNNER_TEMP "hxcpp-cache"
          $samples = @(
            @("arena", "cpp.hxml"),
            @("http2", "cpp.hxml"),
            @("localconnection", "cpp.hxml"),
            @("multicore", "cpp.hxml"),
            @("rpc-greeter", "cpp.hxml"),
            @("rudp", "cpp.hxml"),
            @("sharedchannel", "cpp.hxml"),
            @("sharedobject", "cpp.hxml"),
            @("simple-application", "cpp.hxml"),
            @("socket-chat", "client-cpp.hxml"),
            @("socket-chat", "server-cpp.hxml"),
            @("udp", "cpp.hxml"),
            @("web-server", "cpp.hxml"),
            @("windows-service", "cpp.hxml"),
            @("websocket-echo", "cpp.hxml"),
            @("worker", "cpp.hxml")
          )
          foreach ($sample in $samples) {
            $dir = $sample[0]
            $hxml = $sample[1]
            Write-Host "::group::samples/$dir/$hxml"
            haxe --cwd "samples/$dir" $hxml
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              Write-Host ("::error::samples/{1}/{2} did not build: haxe exited with code {0} (0x{0:X8})" -f $code, $dir, $hxml)
              exit 1
            }
          }

      # Building a sample proves it typechecks and nothing more. This one
      # drives a real client through a real handshake and exits non-zero if
      # the echo does not come back intact, which a server that could not
      # receive a client's messages would fail.
      - name: Run websocket echo sample
        working-directory: export/websocket-echo
        run: |
          .\WebSocketEchoSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::WebSocketEchoSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # The other samples that end on their own. Building a sample
      # proves it typechecks; running one is the only thing that exercises
      # the Application and ServerApplication bootstrap a user actually
      # starts from, which no unit test touches. The web server one serves a
      # real request through the real HTTP path and prints the body it got
      # back, so a broken response is a failed job rather than a silent one.
      - name: Run web server sample
        working-directory: export/web-server
        run: |
          .\SimpleWebServerSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::SimpleWebServerSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # Both pages over HTTP/2 from a server that also speaks HTTP/1.1, each
      # body checked against what was served. The client never falls back to
      # HTTP/1.1, so a pass is two HTTP/2 streams; anything else exits 1.
      - name: Run HTTP/2 sample
        working-directory: export/http2
        run: |
          .\Http2Sample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::Http2Sample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # One listener spread over several runtimes: sixteen requests at once,
      # answered by more than one runtime, then a drain that exits them. Exits
      # 1 if a request goes unanswered or a single runtime answered them all.
      - name: Run multicore sample
        working-directory: export/multicore
        run: |
          .\MulticoreSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::MulticoreSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Run simple application sample
        working-directory: export/simple-application
        run: |
          .\SimpleApplicationSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::SimpleApplicationSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      - name: Run worker sample
        working-directory: export/worker
        run: |
          .\WorkerSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::WorkerSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

      # The game-server primitives together: an authoritative server and
      # sixteen bots, every snapshot a bot decodes checked against what the
      # server built. Exits non-zero on any difference, so a primitive that
      # composes badly with the others fails here even when its own tests
      # pass.
      - name: Run arena sample
        working-directory: export/arena
        run: |
          .\ArenaSample.exe
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error::ArenaSample.exe exited with code {0} (0x{0:X8})" -f $LASTEXITCODE); exit 1 }

  extensions:
    name: Extensions | ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: libuv Poll Backend
            repo: DimensionscapeOrg/crossbyte-libuv
            path: crossbyte-libuv
            haxelib_name: crossbyte-libuv
            apt_packages: libuv1-dev
            native_test_binary: ../crossbyte/export/crossbyte-libuv-native-test/LibuvNativeTestMain
          - label: Brotli Native Backend
            repo: DimensionscapeOrg/crossbyte-brotli
            path: crossbyte-brotli
            haxelib_name: crossbyte-brotli
            apt_packages: ""
            native_test_binary: ../crossbyte/export/crossbyte-brotli-native-test/NativeBrotliTestMain
          - label: LZ4 Native Backend
            repo: DimensionscapeOrg/crossbyte-lz4
            path: crossbyte-lz4
            haxelib_name: crossbyte-lz4
            apt_packages: ""
            native_test_binary: ../crossbyte/export/crossbyte-lz4-native-test/NativeLz4TestMain
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CrossByte
        uses: actions/checkout@v4
        with:
          path: crossbyte

      - name: Checkout ${{ matrix.haxelib_name }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # Two commands, not `update && install`: a failure on the left of && ends
      # neither -e nor the trap, and the step would go on past it.
      - name: Install platform dependencies
        if: ${{ matrix.apt_packages != '' }}
        run: |
          trap 'echo "::error::Exit code $? from: $BASH_COMMAND"' ERR
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install Haxe libraries
        uses: ./crossbyte/.github/actions/haxelibs

      # The extension builds against CrossByte's native externs, which
      # include their Build.xml through ${haxelib:crossbyte}, so the CrossByte
      # checkout has to be resolvable by name as well as by -cp.
      - name: Install hxcpp
        uses: ./crossbyte/.github/actions/hxcpp
        with:
          repository: ${{ env.HXCPP_REPO }}
          ref: ${{ env.HXCPP_REF }}
          crossbyte: ${{ github.workspace }}/crossbyte

      - name: Register ${{ matrix.haxelib_name }}
        run: haxelib dev ${{ matrix.haxelib_name }} "$GITHUB_WORKSPACE/${{ matrix.path }}"

      - name: Run extension interpreter tests
        working-directory: ${{ matrix.path }}
        run: haxe test.hxml

      - name: Build extension native tests
        working-directory: ${{ matrix.path }}
        run: haxe native-test.hxml

      - name: Run extension native tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.native_test_binary }}
