name: CrossByte CI
run-name: CrossByte CI | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: "4.3.7"
  HXCPP_REPO: "https://github.com/dimensionscape/hxcpp.git"
  # The branch this project is developed against, not the one the upstream PR
  # lives on. socket-fixes is kept clean and narrow so HaxeFoundation can take
  # it; production is that fix plus the Windows file_write correction and a
  # catch-up with upstream, and is what a local build uses. CI following the PR
  # branch meant CI and every developer were testing different hxcpp -- benign
  # while the suite passed on both, and widening with every upstream merge
  # production took and socket-fixes did not.
  HXCPP_REF: "production"

jobs:
  core-tests:
    name: Core | Haxe Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install test dependencies
        run: haxelib install utest --quiet

      # haxe itself, not `haxelib run aedifex task interp-tests`. haxelib's
      # aedifex is 0.0.2, which has no `task` command: it printed its banner
      # and exited 0, so this step and the one below were green in a few
      # seconds for as long as they had been written that way, and the
      # interpreter suite never ran here. Each task in Aedifex.hx is one
      # hxml, so this is the same command without the tool in between.
      - name: Run interpreter test suite
        run: haxe ci/interp-tests.hxml

      # Every sample's check.hxml begins with --cwd ../.., so it runs from
      # its own directory, which is what --cwd reproduces here.
      - name: Validate sample builds
        run: |
          set -euo pipefail
          for sample in \
            localconnection \
            rpc-greeter \
            rudp \
            sharedchannel \
            sharedobject \
            simple-application \
            socket-chat \
            udp \
            web-server \
            websocket-echo \
            worker; do
            echo "::group::samples/${sample}"
            haxe --cwd "samples/${sample}" check.hxml
            echo "::endgroup::"
          done

  # The jvm target had no CI at all: both entry points existed, neither was
  # ever built or run here. Three jvm defects were found and fixed by hand
  # this release (a PriorityQueue VerifyError, a SwitchTable
  # ClassCastException, Vector every/some/filter), with nothing to stop
  # them coming back — and the full suite was in fact red when this job was
  # added, over IPv6 text the jvm renders differently.
  #
  # Java 8 deliberately: it is the floor those VerifyError fixes were
  # verified against, and a newer JVM would not reproduce them.
  jvm-tests:
    name: Core | JVM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install test dependencies
        run: |
          haxelib install utest --quiet
          # --jvm needs hxjava, and nothing else in this job pulls it in.
          haxelib install hxjava --quiet

      - name: Build jvm suites
        run: |
          set -euo pipefail
          haxe ci/jvm-smoke.hxml
          haxe ci/jvm-tests.hxml

      # The smoke jar covers the non-networking core; the full jar adds
      # auth, db, http, net, ipc and system. Both run, because the smoke
      # subset passing is exactly what let the full suite stay red unseen.
      - name: Run jvm smoke suite
        run: java -jar export/jvm/CrossByteJvmSmoke.jar

      - name: Run jvm test suite
        run: java -jar export/jvm/CrossByteTests.jar

  docs:
    name: Core | API Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib install dox --quiet
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}

      # Before the XML is built, because these examples are what goes into it.
      # A reader who copies one out of the published docs expects it to
      # compile, and for a long time the ones in File.hx could not: they were
      # ActionScript, and underneath the syntax were a method that does not
      # exist, an instance method called statically, and an unescaped Windows
      # path. Nothing but a compiler was ever going to notice.
      - name: Typecheck documentation examples
        run: node ci/doc-examples.js

      - name: Build API XML
        run: |
          rm -rf export/docs-api export/docs-site
          mkdir -p export/docs-api export/docs-site
          haxe ci/docs-api.hxml

      - name: Generate docs site
        run: |
          haxelib run dox \
            -i export/docs-api/crossbyte.xml \
            -o export/docs-site \
            --title CrossByte \
            --toplevel-package crossbyte \
            --include '^crossbyte(\.|$)' \
            --exclude '\._internal(\.|$)' \
            -D version "1.0.0-rc.1" \
            -D source-path "https://github.com/dimensionscapeorg/crossbyte/blob/main/src/" \
            -D website "https://github.com/dimensionscapeorg/crossbyte" \
            -D logo crossbyte.png \
            -D description "CrossByte API reference"

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbyte-api-docs
          path: export/docs-site
          if-no-files-found: error

  cpp-audit:
    name: Core | hxcpp API Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          # Every native extern includes its Build.xml through
          # ${haxelib:crossbyte}, so hxcpp has to be able to resolve this
          # repository by name. Without it the first cpp build in the job
          # stops at 'Could not find haxelib crossbyte'.
          haxelib dev crossbyte "$GITHUB_WORKSPACE"

      - name: Bootstrap hxcpp tools
        run: |
          set -euo pipefail
          HXCPP_DIR="$(haxelib path hxcpp | head -n 1)"
          (cd "$HXCPP_DIR/tools/run" && haxe compile.hxml)
          (cd "$HXCPP_DIR/tools/hxcpp" && haxe compile.hxml)

      # haxe directly, for the reason on the interpreter step above: through
      # haxelib's aedifex 0.0.2 each of these printed a banner and passed,
      # and none of the three audits had ever run here.
      - name: Type-check C++ API surface
        run: haxe ci/cpp-api-audit.hxml

      - name: Type-check timer burst support
        run: haxe ci/cpp-timer-burst-audit.hxml

      # precision_tick swaps the frame wait for one that spins the tail
      # rather than sleeping it. No test hxml defines it, so the branch
      # compiled nowhere and could be broken by any edit to the loop
      # without a single job noticing -- which is exactly what nearly
      # happened when the wait was rewritten to anchor its deadline.
      - name: Type-check precision tick frame wait
        run: haxe ci/cpp-precision-tick-audit.hxml

  posix-crypto:
    name: Core | Crypto, System (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          # Intel, not macos-latest, which is Apple Silicon now. Haxe
          # 4.3.7 publishes no macOS arm64 build -- the release carries
          # haxe-4.3.7-osx.tar.gz (x64) and haxe-4.3.7-linux-arm64.tar.gz
          # and nothing else -- so setup-haxe refuses an arm64 runner with
          # "arm64 not supported" and the job dies before it installs
          # anything. macos-13 was the usual answer and is retired; this is
          # its replacement, and it is a standard runner rather than one of
          # the paid -large ones.
          - os: macos-15-intel
            label: macOS
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        # v2, here and not yet elsewhere: v1 installs Neko where the macOS
        # haxelib binary cannot find it, and the job stopped at
        # "dyld: Library not loaded: @rpath/libneko.2.dylib". setup-haxe fixed
        # that in v2.0.0 (#47). The other jobs pass on v1 and are left alone.
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib install utest --quiet
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          # Every native extern includes its Build.xml through
          # ${haxelib:crossbyte}, so hxcpp has to be able to resolve this
          # repository by name. Without it the first cpp build in the job
          # stops at 'Could not find haxelib crossbyte'.
          haxelib dev crossbyte "$GITHUB_WORKSPACE"

      - name: Bootstrap hxcpp tools
        run: |
          set -euo pipefail
          HXCPP_DIR="$(haxelib path hxcpp | head -n 1)"
          (cd "$HXCPP_DIR/tools/run" && haxe compile.hxml)
          (cd "$HXCPP_DIR/tools/hxcpp" && haxe compile.hxml)

      # libsodium is compiled from vendored sources, so there is nothing
      # to install; this job proves that build works off Windows.
      - name: Build crypto suite
        run: haxe ci/posix-crypto-tests.hxml

      - name: Run crypto suite
        run: ./export/ci-posix-crypto/PosixCryptoMain

      # System reaches a different implementation per platform, and only the
      # Windows one had a job compiling it -- the group that covers it runs
      # from the native smoke suite. Both POSIX implementations are built and
      # run here for the same reason libsodium is above.
      - name: Build system suite
        run: haxe ci/posix-system-tests.hxml

      - name: Run system suite
        run: ./export/ci-posix-system/PosixSystemMain

  postgres:
    name: Data | Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib install utest --quiet
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          # Every native extern includes its Build.xml through
          # ${haxelib:crossbyte}, so hxcpp has to be able to resolve this
          # repository by name. Without it the first cpp build in the job
          # stops at 'Could not find haxelib crossbyte'.
          haxelib dev crossbyte "$GITHUB_WORKSPACE"

      - name: Bootstrap hxcpp tools
        run: |
          set -euo pipefail
          HXCPP_DIR="$(haxelib path hxcpp | head -n 1)"
          (cd "$HXCPP_DIR/tools/run" && haxe compile.hxml)
          (cd "$HXCPP_DIR/tools/hxcpp" && haxe compile.hxml)

      # The driver dlopens libpq at runtime rather than linking it, so the
      # client library has to be installed even though nothing links against it.
      # libpq.so.5 is the name it looks for.
      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq5

      - name: Build postgres integration suite
        run: haxe ci/postgres-tests.hxml

      # CROSSBYTE_PG_REQUIRED is what makes this job mean anything: without a
      # reachable server the suite would otherwise skip every case and report a
      # green run, so a broken service container or a missing libpq would look
      # exactly like success. With it set, not reaching the server fails.
      - name: Run postgres integration suite
        env:
          CROSSBYTE_PG_REQUIRED: "1"
          CROSSBYTE_PG_HOST: 127.0.0.1
          CROSSBYTE_PG_PORT: "5432"
          CROSSBYTE_PG_USER: postgres
          CROSSBYTE_PG_PASSWORD: postgres
          CROSSBYTE_PG_DATABASE: postgres
        run: ./export/ci-postgres-tests/PostgresIntegrationMain

  native-smoke:
    name: Core | Native Smoke
    runs-on: windows-latest
    # The first run to get all the way through (35813704548) took 21 minutes,
    # the samples aside, against a limit of 25 -- and the browser and TURN
    # interop steps move with the network. 35 leaves room for a slow runner
    # without letting a hang run on.
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib install utest --quiet
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          # Every native extern includes its Build.xml through
          # ${haxelib:crossbyte}, so hxcpp has to be able to resolve this
          # repository by name. Without it the first cpp build in the job
          # stops at 'Could not find haxelib crossbyte'.
          haxelib dev crossbyte $env:GITHUB_WORKSPACE

      - name: Bootstrap hxcpp tools
        run: |
          $hxcppDir = (haxelib path hxcpp | Select-Object -First 1).Trim()
          Push-Location (Join-Path $hxcppDir "tools/run")
          haxe compile.hxml
          Pop-Location
          Push-Location (Join-Path $hxcppDir "tools/hxcpp")
          haxe compile.hxml
          Pop-Location

      - name: Build browser (js) target
        run: haxe ci/js-build.hxml

      - name: Build Node target
        run: |
          haxelib install hxnodejs --always --quiet
          haxe ci/node-build.hxml

      - name: Run portable suite on Node
        run: |
          haxe ci/js-tests.hxml
          node export/js-tests/tests.js

      - name: Run Node-only suite on Node
        run: |
          haxe ci/js-runtime-tests.hxml
          node export/js-runtime-tests/runtime.js

      # Node is not a browser. It has no window, no document, and none of a
      # page's restrictions, so a bundle it runs happily can still fail to load
      # in one -- Random's seed was an AtomicInt, which Haxe implements on js
      # with a SharedArrayBuffer that an ordinary page is not given, and it
      # threw while loading before any test ran. Every js build stayed green.
      - name: Run portable suite in a headless browser
        run: |
          npm install --no-save --no-audit --no-fund puppeteer node-turn
          haxe ci/browser-tests.hxml
          node ci/browser/run.js

      # The only job here whose result depends on an implementation nobody in
      # this repository wrote. Every other test proves this code agrees with
      # itself, which is worth a great deal and is not the same thing: a
      # checksum byte order, a chunk layout or an integrity scheme can be
      # perfectly self-consistent and understood by nothing else alive.
      #
      # It runs after the native smoke build because it needs the same
      # toolchain, and it found a real bug the first time it ran -- one failed
      # send deafening a UDP socket, which every other test had missed because
      # none of them sent to somewhere unreachable.
      #
      # Four cases, so it is not quick: both signalling directions, against a
      # browser publishing its addresses and one hiding them behind .local mDNS
      # names. The hiding one is the browser every visitor actually runs, and
      # the only configuration where the path has to be learned from an
      # incoming check rather than dialled.
      - name: Interoperate with a real browser
        run: |
          haxe ci/browser-interop.hxml
          node ci/interop/run.js

      # The other test whose result depends on somebody else's code, and for
      # the same reason. The suite connects two peers through a relay written
      # here, which verifies a request with the very code that produced it --
      # so the two agree about anything they are both wrong about. Long-term
      # credentials are the obvious place for that, the key being MD5 of
      # username, realm and password rather than the password itself, but it
      # applies equally to permissions and to how relayed data is wrapped.
      #
      # node-turn implements RFC 5389 and 5766. What it accepts is evidence.
      #
      # node-turn is installed alongside puppeteer above rather than here.
      # `--no-save` prunes whatever is not in package.json, so installing one
      # of them separately uninstalls the other, and the only reason that would
      # not break the browser test today is the order these steps run in.
      # The one target CI can execute that has UDP but no CSPRNG, which is the
      # combination where a support flag can lie. StunClient.isSupported said
      # true on it while the first line of discover() threw; every suite above
      # runs where a CSPRNG exists, so only this step can catch a relapse.
      - name: Check support flags on a CSPRNG-less target
        run: |
          haxe ci/python-support.hxml
          python export/python-support/flagprobe.py

      - name: Interoperate with a real TURN server
        run: |
          haxe ci/relay-interop.hxml
          node ci/relay/run.js

      # Informational: the numbers from a shared runner measure the runner's
      # mood and gate nothing. The step exists so the suite cannot rot -- a
      # benchmark that stopped compiling is one nobody has run in a while.
      - name: Build and run the performance suite (informational)
        run: |
          haxe ci/bench.hxml
          ./export/bench/BenchMain.exe

      - name: Build native smoke harness
        run: haxe ci/native-tests.hxml

      - name: Run native smoke suite
        working-directory: export/ci-native-tests
        run: .\NativeSmokeMain.exe

      - name: Build concurrency stress suite
        run: haxe ci/stress-tests.hxml

      # Data races are invisible to the interpreter suites, which are
      # single-threaded. These cases assert invariants under real thread
      # contention and exit non-zero when one is violated.
      - name: Run concurrency stress suite
        working-directory: export/ci-stress-tests
        run: .\StressMain.exe

  # The samples were the tail of Native Smoke and never actually built there.
  # haxelib's aedifex is 0.0.2, which has no `task` command, so each of the
  # thirteen printed its banner and exited 0; the loop looked at no exit code,
  # and the first sample run failed on an executable that did not exist.
  # Thirteen cold native builds would not have fitted in that job either, so
  # they are a job of their own and build alongside it.
  native-samples:
    name: Core | Native Samples
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          # The samples reach the same native externs as the suites, and
          # those include their Build.xml through ${haxelib:crossbyte}.
          haxelib dev crossbyte $env:GITHUB_WORKSPACE

      - name: Bootstrap hxcpp tools
        run: |
          $hxcppDir = (haxelib path hxcpp | Select-Object -First 1).Trim()
          Push-Location (Join-Path $hxcppDir "tools/run")
          haxe compile.hxml
          Pop-Location
          Push-Location (Join-Path $hxcppDir "tools/hxcpp")
          haxe compile.hxml
          Pop-Location

      # haxe itself rather than `haxelib run aedifex task`: each sample task in
      # Aedifex.hx runs one hxml from the sample's own directory, which --cwd
      # reproduces -- every one of them begins with --cwd ../..
      #
      # One compiler cache for all thirteen. hxcpp keys a cached object by its
      # source and flags, and the samples share the runtime and much of
      # CrossByte, so only the first build pays in full: locally 38s cold,
      # then 5 to 12s each.
      #
      # A native command's exit code does not stop a pwsh script, and the
      # step reports only the last one's -- which is how thirteen builds that
      # built nothing came out green. Each is checked.
      - name: Build native samples
        run: |
          $env:HXCPP_COMPILE_CACHE = Join-Path $env:RUNNER_TEMP "hxcpp-cache"
          $samples = @(
            @("localconnection", "cpp.hxml"),
            @("rpc-greeter", "cpp.hxml"),
            @("rudp", "cpp.hxml"),
            @("sharedchannel", "cpp.hxml"),
            @("sharedobject", "cpp.hxml"),
            @("simple-application", "cpp.hxml"),
            @("socket-chat", "client-cpp.hxml"),
            @("socket-chat", "server-cpp.hxml"),
            @("udp", "cpp.hxml"),
            @("web-server", "cpp.hxml"),
            @("windows-service", "cpp.hxml"),
            @("websocket-echo", "cpp.hxml"),
            @("worker", "cpp.hxml")
          )
          foreach ($sample in $samples) {
            $dir = $sample[0]
            $hxml = $sample[1]
            Write-Host "::group::samples/$dir/$hxml"
            haxe --cwd "samples/$dir" $hxml
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              throw "samples/$dir/$hxml did not build (exit $code)"
            }
          }

      # Building a sample proves it typechecks and nothing more. This one
      # drives a real client through a real handshake and exits non-zero if
      # the echo does not come back intact — the check that was absent while
      # a server could not receive a single client message.
      - name: Run websocket echo sample
        working-directory: export/websocket-echo
        run: .\WebSocketEchoSample.exe

      # The other three samples that end on their own. Building a sample
      # proves it typechecks; running one is the only thing that exercises
      # the Application and ServerApplication bootstrap a user actually
      # starts from, which no unit test touches. The web server one serves a
      # real request through the real HTTP path and prints the body it got
      # back, so a broken response is a failed job rather than a silent one.
      - name: Run web server sample
        working-directory: export/web-server
        run: .\SimpleWebServerSample.exe

      - name: Run simple application sample
        working-directory: export/simple-application
        run: .\SimpleApplicationSample.exe

      - name: Run worker sample
        working-directory: export/worker
        run: .\WorkerSample.exe

  extensions:
    name: Extensions | ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: libuv Poll Backend
            repo: DimensionscapeOrg/crossbyte-libuv
            path: crossbyte-libuv
            haxelib_name: crossbyte-libuv
            native_deps: sudo apt-get update && sudo apt-get install -y libuv1-dev
            native_test_binary: ../crossbyte/export/crossbyte-libuv-native-test/LibuvNativeTestMain
          - label: Brotli Native Backend
            repo: DimensionscapeOrg/crossbyte-brotli
            path: crossbyte-brotli
            haxelib_name: crossbyte-brotli
            native_deps: ""
            native_test_binary: ../crossbyte/export/crossbyte-brotli-native-test/NativeBrotliTestMain
          - label: LZ4 Native Backend
            repo: DimensionscapeOrg/crossbyte-lz4
            path: crossbyte-lz4
            haxelib_name: crossbyte-lz4
            native_deps: ""
            native_test_binary: ../crossbyte/export/crossbyte-lz4-native-test/NativeLz4TestMain
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CrossByte
        uses: actions/checkout@v4
        with:
          path: crossbyte

      - name: Checkout ${{ matrix.haxelib_name }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install platform dependencies
        if: ${{ matrix.native_deps != '' }}
        run: ${{ matrix.native_deps }}

      - name: Install Haxelibs
        run: |
          haxelib install utest --quiet
          haxelib git hxcpp ${{ env.HXCPP_REPO }} ${{ env.HXCPP_REF }}
          haxelib dev ${{ matrix.haxelib_name }} "$GITHUB_WORKSPACE/${{ matrix.path }}"
          # The extension builds against CrossByte's native externs, which
          # include their Build.xml through ${haxelib:crossbyte}, so this
          # checkout has to be resolvable by name as well as by -cp.
          haxelib dev crossbyte "$GITHUB_WORKSPACE/crossbyte"

      - name: Bootstrap hxcpp tools
        run: |
          set -euo pipefail
          HXCPP_DIR="$(haxelib path hxcpp | head -n 1)"
          (cd "$HXCPP_DIR/tools/run" && haxe compile.hxml)
          (cd "$HXCPP_DIR/tools/hxcpp" && haxe compile.hxml)

      - name: Run extension interpreter tests
        working-directory: ${{ matrix.path }}
        run: haxe test.hxml

      - name: Build extension native tests
        working-directory: ${{ matrix.path }}
        run: haxe native-test.hxml

      - name: Run extension native tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.native_test_binary }}
